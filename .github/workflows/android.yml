name: Build PyNexa Schedule APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org com.pynexa.schedule .

      - name: Configure Android desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          path = kts if kts.exists() else groovy

          if not path.exists():
              raise SystemExit("Android app Gradle file not found")

          text = path.read_text()

          if path.suffix == ".kts":
              enabled = "isCoreLibraryDesugaringEnabled = true"
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              enabled = "coreLibraryDesugaringEnabled true"
              dependency = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          if "coreLibraryDesugaringEnabled" not in text:
              text, count = re.subn(
                  r"(compileOptions\s*\{)",
                  r"\1\n        " + enabled,
                  text,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not find compileOptions block")

if "desugar_jdk_libs" not in text:
    if re.search(r"(?m)^\s*dependencies\s*\{", text):
        text, count = re.subn(
            r"(dependencies\s*\{)",
            r"\1\n    " + dependency,
            text,
            count=1
        )
        if count != 1:
            raise SystemExit("Could not update dependencies block")
    else:
        text += "\n\ndependencies {\n    " + dependency + "\n}\n"
          path.write_text(text)
          print(f"Desugaring configured in {path}")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pynexa-schedule-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
